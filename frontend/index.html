<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier-3 Docker App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #2e1e1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .status-section {
            margin: 25px 0;
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f8f9ff;
            border-radius: 5px;
        }
        
        .status-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            color: #555;
            font-weight: 500;
        }
        
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-badge.online {
            background: #4caf50;
            color: white;
        }
        
        .status-badge.offline {
            background: #f44336;
            color: white;
        }
        
        .status-badge.loading {
            background: #ff9800;
            color: white;
        }
        
        .api-section {
            margin: 25px 0;
            padding: 15px;
            border-left: 4px solid #764ba2;
            background: #f8f8ff;
            border-radius: 5px;
        }
        
        .api-section h3 {
            color: #764ba2;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .response {
            margin-top: 15px;
            padding: 12px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            border-radius: 5px;
            display: none;
        }
        
        .response.show {
            display: block;
        }
        
        .response.error {
            background: #ffebee;
            border-left-color: #f44336;
        }
        
        .response-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        
        .response-content {
            color: #555;
            font-size: 13px;
            word-break: break-all;
            font-family: monospace;
            background: white;
            padding: 8px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tier-3 Docker App</h1>
        
        <!-- Service Status Section -->
        <div class="status-section">
            <h3>Service Status</h3>
            <div class="status-item">
                <span class="status-label">Backend API:</span>
                <span class="status-badge loading" id="backendStatus">Checking...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Database:</span>
                <span class="status-badge loading" id="dbStatus">Checking...</span>
            </div>
        </div>
        
        <!-- API Test Section -->
        <div class="api-section">
            <h3>Test API</h3>
            <input type="text" id="userInput" placeholder="Enter your name" />
            <button onclick="testAPI()">Send Request</button>
            <div class="response" id="response">
                <div class="response-title">Response:</div>
                <div class="response-content" id="responseContent"></div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL
        const API_URL = 'http://localhost:3000';

        // Check service status when page loads
        window.addEventListener('load', function() {
            checkBackendStatus();
            checkDatabaseStatus();
        });

        // Check if Backend is running
        function checkBackendStatus() {
            fetch(`${API_URL}/health`)
                .then(response => {
                    document.getElementById('backendStatus').className = 'status-badge online';
                    document.getElementById('backendStatus').textContent = 'Online';
                })
                .catch(error => {
                    document.getElementById('backendStatus').className = 'status-badge offline';
                    document.getElementById('backendStatus').textContent = 'Offline';
                });
        }

        // Check if Database is connected
        function checkDatabaseStatus() {
            fetch(`${API_URL}/db-health`)
                .then(response => {
                    document.getElementById('dbStatus').className = 'status-badge online';
                    document.getElementById('dbStatus').textContent = 'Online';
                })
                .catch(error => {
                    document.getElementById('dbStatus').className = 'status-badge offline';
                    document.getElementById('dbStatus').textContent = 'Offline';
                });
        }

        // Send request to Backend API
        function testAPI() {
            const name = document.getElementById('userInput').value;
            
            if (!name.trim()) {
                alert('Please enter a name');
                return;
            }

            fetch(`${API_URL}/api/hello`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name: name })
            })
            .then(response => response.json())
            .then(data => {
                displayResponse(data, false);
            })
            .catch(error => {
                displayResponse({ error: error.message }, true);
            });
        }

        // Display API response
        function displayResponse(data, isError) {
            const responseDiv = document.getElementById('response');
            const responseContent = document.getElementById('responseContent');
            responseContent.textContent = JSON.stringify(data, null, 2);
            responseDiv.classList.add('show');
            
            if (isError) {
                responseDiv.classList.add('error');
            } else {
                responseDiv.classList.remove('error');
            }
        }
    </script>
</body>
</html>
